workflows:
  ios-ipa:
    name: CrimTube iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Build unsigned app
        script: |
          cd ios
          xcodebuild \
            -project CrimTube.xcodeproj \
            -scheme CrimTube \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/CrimTube.app Payload/
          zip -r CrimTube.ipa Payload
    artifacts:
      - CrimTube.ipa
