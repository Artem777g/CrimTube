apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion "25.0.0"
    defaultConfig {
        applicationId "io.github.gohoski.notpipe.modern"
        minSdkVersion 3
        //noinspection OldTargetApi
        targetSdkVersion 25
        versionCode 4
        versionName "0.5.0"
        setProperty("archivesBaseName", "CrimTube-$versionName") //e.g. CrimTube-0.1.0-release.apk
    }
    buildTypes {
        release {
            //Optimizations totally work down to API 1 and result in smaller file size.
            shrinkResources true //reduces apk size removing unused code
            minifyEnabled true //increase performance optimizing dex files (obfuscation)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        disable 'MissingTranslation'
    }
}

dependencies {
    testCompile 'junit:junit:4.12'
}


tasks.whenTaskAdded { task ->
    if (task.name.toLowerCase().contains("aidl") || task.name.toLowerCase().contains("renderscript")) {
        task.enabled = false
    }
}
